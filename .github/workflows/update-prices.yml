name: Atualizar preços (dólar, soja, milho)

on:
  schedule:
    # Roda a cada 5 minutos, começando no minuto 3 (evita o "topo da hora",
    # horário de maior fila no GitHub Actions). Em picos de uso o GitHub pode
    # atrasar execuções agendadas — é uma limitação da plataforma gratuita,
    # não do script.
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar preços
        run: python update_prices.py

      - name: Commitar se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Atualiza preços ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "Sem mudanças em data.json — nada para commitar."
          fi
